[project]
name = "ai-studio-orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bentoml>=1.4.35",
    "dvc>=3.66.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0", "ruff>=0.9.0", "pyrefly>=0.19.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
project-includes = ["src/ai_studio_orchestrator/**/*.py"]
search-path = ["src"]
